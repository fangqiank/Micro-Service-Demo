<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grayGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000025"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">MicroServiceDemo Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">.NET 10 Microservices with Kubernetes Deployment</text>

  <!-- ===== EXTERNAL CLIENT ===== -->
  <rect x="420" y="75" width="260" height="50" rx="8" fill="url(#grayGradient)" filter="url(#shadow)"/>
  <text x="550" y="100" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="600">External Client / Browser</text>
  <text x="550" y="116" text-anchor="middle" font-family="monospace" font-size="10" fill="#d1d5db">http://localhost:3000 (frontend)</text>

  <!-- ===== NGINX INGRESS ===== -->
  <rect x="375" y="155" width="350" height="55" rx="10" fill="url(#redGradient)" filter="url(#shadow)"/>
  <text x="550" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="700">NGINX Ingress</text>
  <text x="550" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#fecaca">acme.com/api/platform | acme.com/api/cmd/platform</text>

  <!-- Arrow: Client -> Ingress -->
  <line x1="550" y1="125" x2="550" y2="153" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== PLATFORM SERVICE ===== -->
  <rect x="50" y="260" width="400" height="200" rx="12" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="260" width="400" height="40" rx="12" fill="url(#blueGradient)"/>
  <rect x="50" y="285" width="400" height="15" fill="url(#blueGradient)"/>
  <text x="250" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">PlatformService</text>

  <!-- PlatformService Details -->
  <text x="70" y="325" font-family="monospace" font-size="11" fill="#475569">GET  /api/platform</text>
  <text x="70" y="342" font-family="monospace" font-size="11" fill="#475569">GET  /api/platform/{id}</text>
  <text x="70" y="359" font-family="monospace" font-size="11" fill="#475569">POST /api/platform</text>

  <line x1="70" y1="368" x2="430" y2="368" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="388" font-family="monospace" font-size="10" fill="#94a3b8">gRPC Server :5000 (dev) / :666 (K8S)</text>
  <text x="70" y="405" font-family="monospace" font-size="10" fill="#94a3b8">RabbitMQ Publisher (fanout exchange)</text>
  <text x="70" y="422" font-family="monospace" font-size="10" fill="#94a3b8">HTTP Client -> CommandService</text>
  <text x="70" y="439" font-family="monospace" font-size="10" fill="#94a3b8">EF Core + PostgreSQL / InMemory</text>

  <!-- ===== COMMAND SERVICE ===== -->
  <rect x="650" y="260" width="400" height="200" rx="12" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="650" y="260" width="400" height="40" rx="12" fill="url(#greenGradient)"/>
  <rect x="650" y="285" width="400" height="15" fill="url(#greenGradient)"/>
  <text x="850" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="white" font-weight="700">CommandService</text>

  <!-- CommandService Details -->
  <text x="670" y="325" font-family="monospace" font-size="11" fill="#475569">GET  /api/cmd/platform</text>
  <text x="670" y="342" font-family="monospace" font-size="11" fill="#475569">POST /api/cmd/platform</text>
  <text x="670" y="359" font-family="monospace" font-size="11" fill="#475569">GET  /api/cmd/platforms/{pid}/commands</text>
  <text x="670" y="376" font-family="monospace" font-size="11" fill="#475569">GET  /api/cmd/platforms/{pid}/commands/{cid}</text>
  <text x="670" y="393" font-family="monospace" font-size="11" fill="#475569">POST /api/cmd/platforms/{pid}/commands</text>

  <line x1="670" y1="402" x2="1030" y2="402" stroke="#e2e8f0" stroke-width="1"/>
  <text x="670" y="422" font-family="monospace" font-size="10" fill="#94a3b8">gRPC Client (startup sync)</text>
  <text x="670" y="439" font-family="monospace" font-size="10" fill="#94a3b8">RabbitMQ Subscriber (BackgroundService)</text>
  <text x="670" y="456" font-family="monospace" font-size="10" fill="#94a3b8">EF Core + InMemory DB</text>

  <!-- ===== INFRASTRUCTURE ===== -->
  <!-- PostgreSQL -->
  <rect x="50" y="530" width="200" height="70" rx="10" fill="url(#purpleGradient)" filter="url(#shadow)"/>
  <text x="150" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="700">PostgreSQL 16</text>
  <text x="150" y="578" text-anchor="middle" font-family="monospace" font-size="10" fill="#ddd6fe">:5432 platformsdb</text>
  <text x="150" y="593" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">+ PVC 200Mi (K8S)</text>

  <!-- RabbitMQ -->
  <rect x="450" y="530" width="200" height="70" rx="10" fill="url(#orangeGradient)" filter="url(#shadow)"/>
  <text x="550" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="700">RabbitMQ 3</text>
  <text x="550" y="578" text-anchor="middle" font-family="monospace" font-size="10" fill="#fef3c7">:5672 / :15672 (mgmt)</text>
  <text x="550" y="593" text-anchor="middle" font-family="monospace" font-size="9" fill="#fde68a">fanout exchange "trigger"</text>

  <!-- Frontend -->
  <rect x="810" y="530" width="200" height="70" rx="10" fill="url(#grayGradient)" filter="url(#shadow)"/>
  <text x="910" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="700">Frontend</text>
  <text x="910" y="578" text-anchor="middle" font-family="monospace" font-size="10" fill="#d1d5db">HTML / CSS / JS (vanilla)</text>
  <text x="910" y="593" text-anchor="middle" font-family="monospace" font-size="9" fill="#9ca3af">:3000 (python http.server)</text>

  <!-- ===== ARROWS ===== -->

  <!-- Ingress -> PlatformService -->
  <path d="M 430 210 L 250 210 L 250 258" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="310" y="225" font-family="monospace" font-size="9" fill="#3b82f6">/api/platform</text>

  <!-- Ingress -> CommandService -->
  <path d="M 670 210 L 850 210 L 850 258" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="730" y="225" font-family="monospace" font-size="9" fill="#10b981">/api/cmd/platform</text>

  <!-- PlatformService -> CommandService: HTTP POST sync -->
  <line x1="452" y1="310" x2="648" y2="310" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowBlue)"/>
  <rect x="495" y="293" width="110" height="16" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="304" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6" font-weight="600">HTTP POST sync</text>

  <!-- PlatformService -> RabbitMQ -->
  <path d="M 350 462 L 350 505 L 500 505 L 500 528" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="360" y="500" font-family="monospace" font-size="9" fill="#f59e0b">publish</text>

  <!-- RabbitMQ -> CommandService -->
  <path d="M 600 505 L 750 505 L 750 462" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="630" y="500" font-family="monospace" font-size="9" fill="#f59e0b">subscribe</text>

  <!-- CommandService -> PlatformService: gRPC -->
  <line x1="648" y1="380" x2="452" y2="380" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>
  <rect x="500" y="366" width="100" height="16" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="550" y="377" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b5cf6" font-weight="600">gRPC sync</text>

  <!-- PlatformService -> PostgreSQL -->
  <line x1="150" y1="462" x2="150" y2="528" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="160" y="500" font-family="monospace" font-size="9" fill="#8b5cf6">EF Core</text>

  <!-- Frontend <- -> both services -->
  <path d="M 910 528 L 910 490 L 1050 490 L 1050 240 L 550 240 L 550 208" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="760" y="484" font-family="monospace" font-size="9" fill="#6b7280">REST (CORS)</text>

  <!-- ===== LEGEND ===== -->
  <rect x="50" y="640" width="1000" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="665" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" font-weight="700">Data Flow:</text>

  <!-- HTTP POST -->
  <line x1="160" y1="662" x2="210" y2="662" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="218" y="666" font-family="monospace" font-size="10" fill="#475569">HTTP POST (sync, on create)</text>

  <!-- RabbitMQ -->
  <line x1="430" y1="662" x2="480" y2="662" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="488" y="666" font-family="monospace" font-size="10" fill="#475569">RabbitMQ fanout (async)</text>

  <!-- gRPC -->
  <line x1="670" y1="662" x2="720" y2="662" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="728" y="666" font-family="monospace" font-size="10" fill="#475569">gRPC (startup sync)</text>

  <text x="70" y="695" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Seed data: PlatformService seeds 3 platforms at startup, syncs each to CommandService via HTTP POST. gRPC/RabbitMQ available in K8S with PostgreSQL.</text>

  <!-- Port info -->
  <rect x="50" y="730" width="1000" height="80" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="755" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" font-weight="700">Ports (Development):</text>
  <text x="70" y="775" font-family="monospace" font-size="10" fill="#475569">PlatformService: :5000  |  CommandService: :8080  |  Frontend: :3000  |  RabbitMQ: :5672  |  PostgreSQL: :5432</text>
  <text x="70" y="800" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b" font-weight="700">Ports (K8S):</text>
  <text x="150" y="800" font-family="monospace" font-size="10" fill="#475569">PlatformService: :80 (HTTP) + :666 (gRPC)  |  CommandService: :80  |  NGINX Ingress: :80</text>
</svg>
